version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-auto-car-service
    container_name: sacs-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      APP_NAME: "Smart Auto Car Service"
      APP_ENV: local
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smart_car_service
      DB_USERNAME: root
      DB_PASSWORD: secretpassword
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sacs-db
    restart: unless-stopped
    ports:
      - "33066:3306"
    environment:
      MYSQL_DATABASE: smart_car_service
      MYSQL_ROOT_PASSWORD: secretpassword
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
